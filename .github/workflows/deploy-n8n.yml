name: CI - Build & Push Image

on:
  push:
    branches: ['main2']
  workflow_dispatch:

env:
  REGISTRY: registry.whitelabel.lat
  IMAGE_NAME: whitelabel-ai/n8n-v2
  REGISTRY_IMAGE: registry.whitelabel.lat/whitelabel-ai/n8n-v2
  RUNNERS_IMAGE_NAME: whitelabel-ai/runners-v2
  REGISTRY_RUNNERS_IMAGE: registry.whitelabel.lat/whitelabel-ai/runners-v2

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build n8n (generate ./compiled)
        run: node scripts/build-n8n.mjs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Get version from package.json
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Compute build tag (YYYYMMDD-run_number)
        run: echo "BUILD_TAG=$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/images/n8n/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ steps.package-version.outputs.current-version }}
            ${{ env.REGISTRY_IMAGE }}:${{ env.BUILD_TAG }}

      - name: Build and push task runners image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/images/runners/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_RUNNERS_IMAGE }}:latest
            ${{ env.REGISTRY_RUNNERS_IMAGE }}:${{ steps.package-version.outputs.current-version }}
            ${{ env.REGISTRY_RUNNERS_IMAGE }}:${{ env.BUILD_TAG }}