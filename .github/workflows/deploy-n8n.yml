name: CI - Build & Push Image

on:
  push:
    branches: ['main2']
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=7168'
  NODE_VERSION: '24.14.1'
  REGISTRY: registry.whitelabel.lat
  IMAGE_NAME: whitelabel-ai/n8n-v2
  REGISTRY_IMAGE: registry.whitelabel.lat/whitelabel-ai/n8n-v2
  RUNNERS_IMAGE_NAME: whitelabel-ai/runners-v2
  REGISTRY_RUNNERS_IMAGE: registry.whitelabel.lat/whitelabel-ai/runners-v2

permissions:
  contents: read

concurrency:
  group: deploy-n8n-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to private registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Setup Node.js + pnpm (cache)
        uses: ./.github/actions/setup-nodejs
        with:
          node-version: ${{ env.NODE_VERSION }}
          build-command: ''
          install-command: 'pnpm install --frozen-lockfile'

      - name: Build n8n (generate ./compiled)
        run: node scripts/build-n8n.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Compute version tag
        run: |
          node -e "process.stdout.write('PACKAGE_VERSION=' + require('./package.json').version + '\n')" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          file: docker/images/n8n/Dockerfile
          platforms: linux/amd64
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ env.PACKAGE_VERSION }}
            N8N_RELEASE_TYPE=stable
          sbom: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ env.PACKAGE_VERSION }}

      - name: Build and push task runners image
        uses: useblacksmith/build-push-action@30c71162f16ea2c27c3e21523255d209b8b538c1 # v2
        with:
          context: .
          file: docker/images/runners/Dockerfile
          platforms: linux/amd64
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            N8N_VERSION=${{ env.PACKAGE_VERSION }}
            N8N_RELEASE_TYPE=stable
          sbom: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ env.REGISTRY_RUNNERS_IMAGE }}:latest
            ${{ env.REGISTRY_RUNNERS_IMAGE }}:${{ env.PACKAGE_VERSION }}
